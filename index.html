    <!-- Google Analytics (loaded only when VITE_GA_ID is set at build time) -->
    <script>window.__GA_ID__='%VITE_GA_ID%';</script>
    <script>
      if(window.__GA_ID__ && window.__GA_ID__ !== '%VITE_GA_ID%' && window.__GA_ID__.startsWith('G-')) {
        var s=document.createElement('script');
        s.async=true;
        s.src='https://www.googletagmanager.com/gtag/js?id='+window.__GA_ID__;
        document.head.appendChild(s);
        window.dataLayer=window.dataLayer||[];
        function gtag(){dataLayer.push(arguments);}
        gtag('js',new Date());
        gtag('config',window.__GA_ID__,{send_page_view:false});
        window.gtag=gtag;
      }
    </script>

    <!-- Fonts -->
