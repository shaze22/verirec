project_id = "sbakkkxuhkxfofpfhdtn"

[auth]
enabled = true
site_url = "https://verirec.vercel.app"
additional_redirect_urls = ["https://verirec.vercel.app/auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_signup = false
enable_confirmations = false
