  <polyline points="91,110 97,101 103,119 109,95 115,123 121,101 127,113 133,107 140,110"
    stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Brand -->
  <text x="156" y="121" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"
    font-size="38" font-weight="700" fill="white" letter-spacing="-0.5">Kaunselor</text>

